name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Weekly, so a new advisory or a toolchain change shows without a push.
  schedule:
    - cron: '17 6 * * 1'

# A newer push to a pull request cancels its older run; main runs each push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      # The floor, the go line of go.mod, and the version the toolchain line
      # prefers (0024-PLAN-go-1-26-9-floor.md, G7). On Go 1.26 the root tests'
      # leak guard needs the goroutineleak profile, an experiment there that
      # Go 1.27 rejects.
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        go: ['1.26.10', '1.27.3']
        include:
          - go: '1.26.10'
            floor: true
            experiment: goroutineleakprofile
          # The Windows floor job alone: its next crash prints every goroutine's
          # stack (0032-REPORT-windows-floor-runtime-crashes.md,
          # 0033-MADR-traceback-on-windows-floor-ci.md).
          - os: windows-2025
            go: '1.26.10'
            traceback: crash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Each job runs the version it installed, never one go.mod selects.
      GOTOOLCHAIN: local
      GOEXPERIMENT: ${{ matrix.experiment }}
      # Empty, the default, on every job but the Windows floor job.
      GOTRACEBACK: ${{ matrix.traceback }}
    steps:
      # The job that runs the API gate fetches every commit and tag: the gate
      # compares with the newest v1 tag (0024-PLAN-api-gate-and-deprecation.md,
      # step 8). The others need the commit alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ (runner.os == 'Linux' && !matrix.floor) && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: the floor is the go line
        if: matrix.floor && runner.os == 'Linux'
        run: |
          set -euo pipefail
          test "$(go version | cut -d' ' -f3)" = "go${{ matrix.go }}"
          test "$(go list -m -f '{{.GoVersion}}')" = "${{ matrix.go }}"
          ( cd cmd/generate && test "$(go list -m -f '{{.GoVersion}}')" = "${{ matrix.go }}" )
      # The newest job runs the version both toolchain lines name, so the
      # matrix and the lines cannot drift apart
      # (0028-PLAN-pin-go-1-27-3-and-floor-1-26-10.md).
      - name: the newest is the toolchain line
        if: "!matrix.floor && runner.os == 'Linux'"
        run: |
          set -euo pipefail
          test "$(go version | cut -d' ' -f3)" = "go${{ matrix.go }}"
          test "$(sed -n 's/^toolchain //p' go.mod)" = "go${{ matrix.go }}"
          test "$(sed -n 's/^toolchain //p' cmd/generate/go.mod)" = "go${{ matrix.go }}"
      - run: go mod download
      # The root package's exported API against the newest v1 tag, by apidiff:
      # an incompatible change fails the job. apidiff exits 0 either way, so
      # scripts/check_api.py reads its report. On a tag push the base is that
      # tag, which compares the tree with itself
      # (0024-PLAN-api-gate-and-deprecation.md, step 8).
      - name: API compatibility (apidiff)
        if: runner.os == 'Linux' && !matrix.floor
        run: make api
      - run: go test -shuffle=on ./...
      - name: test generator module
        working-directory: cmd/generate
        run: go test -shuffle=on ./...
      - run: go build ./example/...
      # On the Linux and Windows jobs, at both versions. On Windows -race needs
      # cgo and a C compiler on PATH, the image's MinGW-w64 gcc, and the step is
      # bash, Git for Windows' (0034-MADR-race-detector-on-windows-ci.md,
      # 0032-REPORT-windows-floor-runtime-crashes.md).
      - name: race detector
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -race -shuffle=on ./...
          ( cd cmd/generate && go test -race -shuffle=on ./... )
      # encoding/json backed by v1 rather than v2, so a difference between the
      # two codecs fails the build (0011-PLAN-engine-tests.md, D7). Go 1.26's
      # default build already uses v1, and its jobs test it.
      - name: root tests with GOEXPERIMENT=nojsonv2
        if: runner.os == 'Linux' && !matrix.floor
        env:
          GOEXPERIMENT: nojsonv2
        run: go test -shuffle=on ./...
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          ( cd cmd/generate && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... )
      - name: vet, gofmt, tidy, lint
        if: runner.os == 'Linux' && !matrix.floor
        run: |
          set -euo pipefail
          go vet ./...
          ( cd cmd/generate && go vet ./... )
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          ( cd cmd/generate && go mod tidy -diff )
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint" make lint
      - name: markdownlint, actionlint, records, tools
        if: runner.os == 'Linux' && !matrix.floor
        run: |
          set -euo pipefail
          npx --yes markdownlint-cli2@0.23.2
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          make check-records
          make check-tools
