version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - modernize
    - nakedret
    - nilerr
    - nolintlint
    - perfsprint
    - revive
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      # errors.AsType's first result is the match, not an error to handle,
      # so `_, ok := errors.AsType[T](err)` discards nothing
      # (0019-PLAN-idioms-performance.md, D12).
      exclude-functions:
        - errors.AsType
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - paramTypeCombine
        - unnamedResult
        - exitAfterDefer
        - octalLiteral
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - elseif
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 40
    gosec:
      excludes:
        - G104
    # Every //nolint names its linter and is still needed.
    nolintlint:
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: atomic
        - name: blank-imports
        - name: confusing-naming
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    # Generated files are linted like the rest (0019-PLAN-idioms-performance.md,
    # D12), but for the rule below.
    generated: disable
    rules:
      # In generated code the repeated strings are schema literals, and the
      # dispatch and decoders are long by construction
      # (0019-MADR-remediate-debugging-pass-findings.md, question 15).
      - linters:
          - goconst
          - gocognit
          - gocyclo
        path: _gen\.go$
      # mkwinsyscall's //sys directives must start "//sys<tab>"; gocritic's
      # commentFormatting allowlist (//go:generate, //export, //line) lacks
      # them. Directive lines only; a prose comment is still checked.
      - linters:
          - gocritic
        path: _windows\.go$
        source: ^//sys\s
      - linters:
          - errcheck
          - gosec
          - unparam
          - revive
          - gocritic
          - goconst
        path: _test\.go
      - linters:
          - godot
        text: Comment should end in a period
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
